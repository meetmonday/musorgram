name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_android:
        description: Build Android APK for arm, arm64, and x64
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_TARGET_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_android && 'android-arm,android-arm64,android-x64' || 'android-arm64' }}
      # Ubuntu 24.04 runners already contain this NDK, unlike Flutter's default
      # r28c. The project keeps using Flutter's default NDK outside CI.
      ORG_GRADLE_PROJECT_musorgramNdkVersion: 29.0.14206865
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          add-job-summary: never

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >-
          flutter build apk --release --no-pub
          --android-skip-build-dependency-validation
          --target-platform "$ANDROID_TARGET_PLATFORMS"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: musorgram-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release --no-pub

      - name: Package Linux bundle
        run: >-
          tar -C build/linux/x64/release
          -czf musorgram-linux-x64.tar.gz bundle

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: musorgram-linux-x64
          path: musorgram-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
